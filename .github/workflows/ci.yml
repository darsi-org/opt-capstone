name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - name: Tests
        run: pytest -q
      - name: Darsi check
        run: python check.py
      - uses: actions/upload-artifact@v4
        with:
          name: darsi-check
          path: darsi-check.json
